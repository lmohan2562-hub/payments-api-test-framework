# Copy to config.properties (git-ignored) to override defaults locally:
#   cp config.example.properties config.properties
#
# Precedence (highest first): -D system property > environment variable > config.properties > built-in defaults.
# Environment variable names are the keys upper-cased with dots replaced by underscores,
# e.g. payments.api.token -> PAYMENTS_API_TOKEN.

# "embedded" (default) starts the offline WireMock simulator. Set a URL to target a real sandbox.
payments.base.url=embedded

# Do NOT put real tokens in files. Supply them via the PAYMENTS_API_TOKEN environment variable / CI secret.
payments.api.token=

payments.http.connect.timeout.ms=2000
payments.http.read.timeout.ms=5000
payments.retry.max.attempts=3
payments.retry.backoff.ms=200
payments.log.bodies=true
