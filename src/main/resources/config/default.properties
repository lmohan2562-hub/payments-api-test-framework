# Default configuration for the synthetic, offline test run.
# Override per environment with env vars (PAYMENTS_BASE_URL, PAYMENTS_API_TOKEN, ...)
# or -D system properties. Never commit real credentials here.

# "embedded" starts the local WireMock simulator on a random port.
payments.base.url=embedded

# Synthetic placeholder accepted only by the embedded simulator.
payments.api.token=local-simulator-placeholder

payments.http.connect.timeout.ms=2000
payments.http.read.timeout.ms=5000
payments.retry.max.attempts=3
payments.retry.backoff.ms=200
payments.log.bodies=true
